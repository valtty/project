{% extends 'portal/base.html' %}
{% block title %}Вход — Учусь.РФ{% endblock %}
{% block content %}
<div class="card card-narrow">
    <h1>Авторизация</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Войти</button>
    </form>
    <p class="auth-link">Еще не зарегистрированы? <a href="{% url 'register' %}">Регистрация</a></p>
</div>
{% endblock %}
